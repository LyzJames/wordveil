[package]
name = "lvjin-core"
version = "0.7.0"
edition = "2024"
autotests = false

[lib]
name = "lvjin_core"
path = "src/lib.rs"

[features]
default = []
test-harness = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
# Development and test builds may launch the Python worker from source under
# docs. Production desktop builds use only the frozen, hash-pinned worker.
dev-worker = []
# Test-only desktop build: exposes the WebView2 DevTools port for the e2e tests.
e2e = ["desktop"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.12.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22.1"
jsonschema = { version = "0.33", default-features = false }
rand = "0.8.5"
# SQLCipher links a separately built static OpenSSL 3.5 LTS (OPENSSL_DIR, see build.rs).
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
# Load the byte-identical embedded MIT dictionary directly; no compressed
# dictionary context or zstd dependency is needed in the application.
jieba-rs = { version = "=0.11.0", default-features = false }
usearch = { version = "=2.26.4", default-features = false }
# Generation connections (0.3.0): blocking HTTPS through Windows SChannel and the
# system certificate store; redirects disabled, timeouts set per connection.
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"] }
url = "=2.5.8"
regex = "=1.13.1"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-native-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = "0.3"
sse-stream = "0.2"
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
cc = "1"
tauri-build = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[[bin]]
name = "lvjin"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "lvjin-public-mcp"
path = "src/public_mcp_main.rs"

# Tests, benchmarks and the validation programs (v0_1_0-verify, v0_2_0-verify) build
# from the docs workspace (docs/tests/Cargo.toml) against this library.
