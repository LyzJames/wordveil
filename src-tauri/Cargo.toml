[package]
name = "lvjin-core"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
name = "lvjin_core"
path = "src/lib.rs"

[features]
default = []
m0-harness = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
# Development and test builds may launch the Python worker from source under
# docs. Production desktop builds use only the frozen, hash-pinned worker.
dev-worker = []

[dependencies]
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.12.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22.1"
jsonschema = { version = "0.33", default-features = false }
rand = "0.8.5"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
jieba-rs = "=0.11.0"
usearch = { version = "=2.26.4", default-features = false }
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
cc = "1"
tauri-build = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials"] }

[[test]]
name = "m0_core"
path = "../../docs/tests/m0/core.rs"
required-features = ["m0-harness"]

[[bin]]
name = "lvjin"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "m0-verify"
path = "../../docs/tests/m0/verify_installation.rs"
required-features = ["m0-harness"]

[[test]]
name = "m0_sqlcipher_diagnostic"
path = "../../docs/tests/m0/sqlcipher_diagnostic.rs"
required-features = ["m0-harness"]

[[test]]
name = "m0_isolation"
path = "../../docs/tests/m0/isolation.rs"
required-features = ["m0-harness"]

[[test]]
name = "m0_model_pool"
path = "../../docs/tests/m0/model_pool.rs"
required-features = ["m0-harness"]

[[test]]
name = "m0_index"
path = "../../docs/tests/m0/index.rs"
required-features = ["m0-harness"]

[[test]]
name = "m0_geometry"
path = "../../docs/tests/m0/geometry.rs"
required-features = ["m0-harness"]

[[test]]
name = "m0_frozen_nine"
path = "../../docs/tests/m0/frozen_nine.rs"
required-features = ["m0-harness"]

[[test]]
name = "m0_frozen_diagnostic"
path = "../../docs/tests/m0/frozen_diagnostic.rs"
required-features = ["m0-harness"]
